<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedéx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-1">
    <nav class="navbar bg-danger">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img src="img/Logo.png" alt="Bootstrap" width="100" height="45"></a>
        </div>
      </nav>
         
      <div class="container d-flex flex-column align-items-center">
        <div class="card w-75 mb-3">
    
            <div class="card-body">
              <h2 class="card-title">Pesquisar Pokémon</h2>
            <form class="d-flex" role="search">
              <input id="campoPesquisa" class="form-control" type="search" placeholder="Digite um Pokémon" aria-label="Search"/>
              <button id="btPesquisa" class="btn btn-danger" type="submit">Buscar</button>
            </form>
            </div>
          </div>

        <div class="card" style="width: 25rem;">
          <div class="row">
            <div class="col">
              <h3 id="txNome" class="card-title text-center">NOME POKÉMON</h3>
            </div>
            <div class="col">
              <h3 id="txNome" class="card-title text-center">#ID</h3>
            </div>  
          </div>
            <img src="..." class="card-img-top text-center" alt="Imagem Pokémon">
            <div class="card-body">
            </div>
            <ul class="list-group list-group-flush">
            <div class="list-group-item">
                <p class="card-text text-center">Tipo</p>
                <div class="row">
                    <div class="col-6 text-center">
                        <h6>Altura</h6>
                        <p class="tvAltura">0,4m</p>
                    </div>
                    <div class="col-6 text-center">
                        <h6>Peso</h6>
                        <p id="tvPeso">6kg</p>
                    </div>
                </div>

                <p>HP: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-danger" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Ataque: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-warning text-white" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Defesa: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-info text-white" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Velocidade: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-success" style="width: 100%">100</div>
                  </div>
            </div>
            <p class="card-text text-center">Habilidade</p>
            <div class="row">
                <div class="col-6 text-center">
                  <span class="badge bg-4">New</span></h1>
                </div>
                <div class="col-6 text-center">
                  <span class="badge bg-4">New</span></h1>
                </div>
            </div>
          </ul>
        </div>
    </div>



    <script src="js/script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>>
</body>
</html>
