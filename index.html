<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <nav class="navbar bg-danger mb-4">
    <div class="container justify-content-center">
      <span class="navbar-brand text-white fw-bold mb-0">Pokédex</span>
    </div>
  </nav>
  <main class="container pb-5">
    <section class="card shadow-sm mx-auto mb-3 pesquisa-card">
      <div class="card-body">
        <h1 class="h4 text-center mb-3">Pesquisar Pokémon</h1>
        <form id="form-busca" class="input-group">
          <input id="campoPesquisa" class="form-control" type="search" placeholder="Nome ou número do Pokémon" value="pikachu" aria-label="Nome ou número do Pokémon" required>
          <button class="btn btn-danger" type="submit">Buscar</button>
        </form>
        <div id="mensagem" class="alert d-none mt-3 mb-0" role="alert" aria-live="polite"></div>
      </div>
    </section>
    <section id="resultado" class="card shadow-sm mx-auto pokemon-card d-none" aria-label="Informações do Pokémon">
      <div class="card-body text-center">
        <h2 class="h4 mb-2"><span id="txNome" class="text-capitalize"></span> <span id="txId" class="text-secondary"></span></h2>
        <img id="img-pokemon" class="pokemon-img" alt="Imagem do Pokémon">
      </div>
      <div class="card-body border-top text-center">
        <h3 class="h6">Tipo</h3>
        <div id="tipos" class="mb-3"></div>
        <div class="row">
          <div class="col-6"><h3 class="h6 mb-1">Altura</h3><p id="tvAltura" class="mb-0"></p></div>
          <div class="col-6"><h3 class="h6 mb-1">Peso</h3><p id="tvPeso" class="mb-0"></p></div>
        </div>
      </div>
      <div class="card-body border-top">
        <h3 class="h6 text-center mb-3">Status</h3>
        <div id="stats"></div>
      </div>
      <div class="card-body border-top text-center">
        <h3 class="h6">Habilidades</h3>
        <div id="habilidades"></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
