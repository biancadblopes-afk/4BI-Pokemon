<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedéx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar bg-danger">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img src="img/Logo.png" alt="Bootstrap" width="100" height="45"></a>
        </div>
      </nav>
         
      <div class="container d-flex flex-column align-items-center">
        <div class="card w-75 mb-3">
    
            <div class="card-body">
              <h1 class="card-title">Pesquisar Pokémon</h1>
            <form class="d-flex" role="search">
              <input class="form-control" type="search" placeholder="Digite um Pokémon" aria-label="Search"/>
              <button class="btn btn-danger" type="submit">Buscar</button>
            </form>
            </div>
          </div>

        <div class="card" style="width: 18rem;">
            <h3 class="card-title text-center">NOME POKÉMON</h3>
            <img src="..." class="card-img-top text-center" alt="Imagem Pokémon">
            <div class="card-body">
            </div>
            <ul class="list-group list-group-flush">
            <div class="list-group-item">
                <p class="card-text text-center">Tipo</p>
                <div class="row">
                    <div class="col-6 text-center">
                        <h6>Altura</h6>
                        <p class="tvAltura">0,4m</p>
                    </div>
                    <div class="col-6 text-center">
                        <h6>Peso</h6>
                        <p id="tvPeso">6kg</p>
                    </div>
                </div>
                <p>HP: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar text-bg-danger" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Ataque: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar text-bg-warning text-white" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Defesa: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar text-bg-info text-white" style="width: 100%">100</div>
                  </div>
            </div>
            <div class="list-group-item">
                <p>Velocidade: </p>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar text-bg-success" style="width: 100%">100</div>
                  </div>
            </div>
            </ul>
        </div>
    </div>



    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
